<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asteroid Watch | Mission Control</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#080f16;--panel:#101d23;--panel2:#14252b;--line:#2b3b3d;--line2:#3f5a55;--ink:#edf2ef;--muted:#a8bbb6;--dim:#7d918c;--lime:#b9f16e;--lime2:#d0ff94;--amber:#f1c879;--teal:#74c9a6;--red:#ff7a6b;
--fs:clamp(12px,1.05vw + .35vh,15px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);background-image:linear-gradient(#14242b66 1px,transparent 1px),linear-gradient(90deg,#14242b66 1px,transparent 1px);background-size:42px 42px;color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:var(--fs);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;color:inherit}
p{margin:0;line-height:1.5;color:var(--muted)}
.eyebrow{font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:.72em;color:#8da6a5}
.btn{background:var(--lime);border:0;border-radius:7px;color:#142014;font-weight:800;font-size:.95em;padding:.7em 1.15em;box-shadow:0 4px 0 #608745;white-space:nowrap}
.btn:hover{background:var(--lime2)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #608745}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.outline{background:transparent;color:#dce8df;border:1px solid #58716a;box-shadow:none}.btn.outline:hover{background:#20332f}
.btn.ghost{background:transparent;border:1px solid #3d5550;color:#cfe0d6;box-shadow:none;padding:.45em .8em;font-weight:700}
.btn.ghost:hover{border-color:var(--lime);color:var(--lime)}

/* Top bar */
header{flex:none;display:flex;align-items:center;gap:2vw;padding:.55rem 2.2vw;background:#101b22;border-bottom:2px solid #b6e879;box-shadow:0 6px 20px #0008}
.brand{font-size:.85em;font-weight:800;letter-spacing:.15em;white-space:nowrap;display:flex;align-items:center;gap:.5em}
.brand span{display:inline-grid;place-items:center;border:1px solid var(--lime);color:var(--lime);border-radius:50%;width:1.9em;height:1.9em}
.stages{display:flex;gap:1.4vw;flex:1;justify-content:center;flex-wrap:wrap}
.stages span{font:.7em 'DM Mono',monospace;color:#5f746f;letter-spacing:.08em;white-space:nowrap}
.stages span:before{content:'● ';color:#3c524c}.stages .on{color:var(--lime)}.stages .on:before{color:var(--lime)}.stages .past{color:#9db3ab}.stages .past:before{content:'✓ ';color:var(--teal)}

/* Main frame: one screen */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 0;gap:0;padding:1.4vh 2.2vw 1.6vh;transition:grid-template-columns .6s ease,gap .6s ease}
main.with-side{grid-template-columns:minmax(0,1fr) clamp(250px,23vw,330px);gap:1.2vw}
.panel{background:linear-gradient(#14252b,#101c23);border:3px solid #35454a;border-radius:10px;box-shadow:0 6px 0 #17252a,0 12px 25px #0006;min-height:0;overflow:hidden}
#content{display:flex;flex-direction:column;padding:2vh 1.6vw;gap:1.2vh}
.side{display:flex;flex-direction:column;min-width:0;padding:1.8vh 1.1vw;gap:1vh;background:linear-gradient(145deg,#1a2c31,#101d23);border-top:5px solid #6c807b;transform:translateX(110%);opacity:0;transition:transform .6s ease,opacity .5s ease}
main.with-side .side{transform:none;opacity:1}
.side-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:.8vh;border-bottom:1px solid #536660}
.side-top .eyebrow{color:var(--lime)}
.clock{font:clamp(22px,2.3vw,32px) 'DM Mono',monospace;color:var(--lime);line-height:1.1}.clock small{font:.42em Manrope;color:#a7bab1}
.bar{height:5px;background:#283b39;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);transition:width .6s}
.checklist{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:.2vh;margin-top:.5vh}
.check{display:grid;grid-template-columns:1.3em 1fr auto;align-items:center;gap:.5em;padding:.32vh 0;font-size:.88em;color:#8fa39d;border-bottom:1px solid #22332f}
.check i{font-style:normal;width:1.15em;height:1.15em;border-radius:50%;border:1.5px solid #4d6460;display:grid;place-items:center;font-size:.75em}
.check b{font-weight:600;color:#6f837e;font-size:.92em;text-align:right}
.check.ok{color:#dfeee2}.check.ok i{background:var(--teal);border-color:var(--teal);color:#0d211b}.check.ok b{color:#f2f8f2}
.check.new{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:rgba(185,241,110,.22)}100%{background:transparent}}
.file-btn{display:flex;align-items:center;gap:.6em;justify-content:center;width:100%;background:#0f2026;border:1px solid #45625b;border-radius:8px;padding:.7em;font-weight:800;color:#e2efe6}
.file-btn:hover{border-color:var(--lime);color:var(--lime)}
.file-btn svg{width:1.3em;height:1.3em}
.log{font-size:.8em;color:#c3d8c9;min-height:1.2em}

/* Shared stage typography */
.step{display:flex;gap:.6em;align-items:center}
.pill{background:var(--lime);color:#19251a;padding:.35em .6em;border-radius:5px;font:700 .7em 'DM Mono',monospace}
h1,h2{margin:0;letter-spacing:-.03em;line-height:1.1}
h2{font-size:clamp(20px,2vw + 1vh,34px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vw}
.stat{padding:1vh .9vw;background:#0b171b;border:1px solid #263a39;border-left:3px solid var(--lime);border-radius:8px}
.stat small{font-size:.72em;color:#9aada7;letter-spacing:.06em}.stat strong{display:block;font:clamp(15px,1.4vw,22px) 'DM Mono',monospace;color:#e9f4e4;margin-top:.3vh}
.photo-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.8vw}
.sky-photo{display:flex;flex-direction:column;background:#07121b;border:1px solid var(--line2);border-radius:8px;overflow:hidden;min-height:0}
.sky-photo svg{flex:1;min-height:0;width:100%;display:block}
.photo-caption{padding:.6vh .7vw;font:.7em 'DM Mono',monospace;color:#b7cbc2}.photo-caption b{color:var(--lime)}
.hint{font-size:.82em;color:#a7bdb4}
.warning{color:#f3c776}
.row-end{display:flex;align-items:center;gap:1vw;flex-wrap:wrap}

/* Intro (first person) */
#intro{position:fixed;inset:0;z-index:40;background:#03070c;display:flex;flex-direction:column}
#intro.hide{animation:fadeout .7s forwards}
@keyframes fadeout{to{opacity:0;visibility:hidden}}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;overflow:hidden}
.scene.on{opacity:1}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.caption{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);width:min(760px,88vw);text-align:center;z-index:3}
.caption p{color:#e8f1ec;font-size:clamp(16px,1.5vw + .6vh,24px);line-height:1.45;text-shadow:0 2px 12px #000}
.caption .eyebrow{display:block;margin-bottom:1vh;color:var(--lime)}
.intro-ctrl{position:absolute;right:3vw;bottom:3.5vh;z-index:5;display:flex;gap:.8em}
.intro-dots{position:absolute;left:3vw;bottom:4.5vh;z-index:5;display:flex;gap:6px}
.intro-dots i{width:8px;height:8px;border-radius:50%;background:#32443f}.intro-dots i.on{background:var(--lime)}
.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #608745,0 0 0 0 #b9f16e66}50%{box-shadow:0 4px 0 #608745,0 0 0 10px #b9f16e00}}
/* scene 1: walking up to the dome */
.s1 .walk{transform-origin:50% 62%;animation:walk 7s ease-out forwards}
@keyframes walk{from{transform:scale(1)}to{transform:scale(1.55)}}
.s1 .bob{animation:bob .9s ease-in-out 6 alternate}
@keyframes bob{to{transform:translateY(6px)}}
/* scene 2: dome slit opens */
.s2 .slitL{animation:slitL 3.2s 1s ease-in-out forwards}.s2 .slitR{animation:slitR 3.2s 1s ease-in-out forwards}
@keyframes slitL{to{transform:translateX(-170px)}}@keyframes slitR{to{transform:translateX(170px)}}
/* scene 3: eyepiece */
.s3 .mover{animation:drift 6s linear infinite}
@keyframes drift{from{transform:translate(-90px,40px)}to{transform:translate(90px,-40px)}}
.s3 .ring{animation:ring 2s 2.5s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes ring{0%{opacity:0;transform:scale(.5)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
/* scene 4: blink comparison */
.s4 .f{opacity:0;animation:blink 2.4s infinite}.s4 .f2{animation-delay:.8s}.s4 .f3{animation-delay:1.6s}
@keyframes blink{0%,30%{opacity:1}34%,100%{opacity:0}}
/* scene 5: orbit calculation */
.s5 .path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4.5s 1s ease-in-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.s5 .calc{font:14px 'DM Mono',monospace;fill:#8fe0b5}
.s5 .cl{opacity:0;animation:show .1s forwards}
@keyframes show{to{opacity:1}}
/* scene 6: alert */
.s6 .alert{animation:alert 1.2s ease-in-out infinite alternate}
@keyframes alert{from{opacity:.25}to{opacity:.9}}

/* Data collection */
.dc-top{display:flex;align-items:center;gap:1.2vw;flex-wrap:wrap}
.dc-top h2{font-size:clamp(18px,1.6vw + .8vh,28px)}
.dc-top .grow{flex:1}
.est{display:flex;gap:.8vw;align-items:stretch}
.est div{background:#0b171b;border:1px solid #2c4440;border-radius:8px;padding:.6vh .8vw;min-width:7.5em}
.est small{display:block;font:.68em 'DM Mono',monospace;color:#8da6a5;letter-spacing:.1em}
.est strong{font:clamp(14px,1.3vw,20px) 'DM Mono',monospace;color:var(--lime)}
.est .left strong{color:#e9f4e4}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.8vw;--hex:clamp(70px,min(9.6vw,17vh),150px)}
.inst{display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 40%,#173538,#0b1a21 80%);border:1px solid #2f4b47;border-radius:10px;padding:1vh .4vw;min-height:0;min-width:0}
.inst.busy{border-color:#7d6a3b}
.inst-head{text-align:center;width:100%;margin-bottom:.4vh}
.inst-head strong{display:block;font-size:.86em;line-height:1.2}
.inst-head small{display:block;font-size:.68em;color:#8ca19b;line-height:1.3}
.inst-tag{display:inline-block;margin-top:.4vh;font:600 .64em 'DM Mono',monospace;letter-spacing:.08em;padding:.15em .5em;border-radius:4px;background:#1f3b31;color:var(--teal)}
.inst.busy .inst-tag{background:#3d321b;color:var(--amber)}
.hexes{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:.6vh}
.node{position:relative;width:var(--hex);height:calc(var(--hex)*.87);clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);border:0;padding:4px;background:#3c5953;transition:transform .15s}
.node:hover{transform:scale(1.05)}
.node:focus-visible{outline:3px solid #fff;outline-offset:3px}
.node-inner{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.2em;width:100%;height:100%;clip-path:inherit;background:#132c30;padding:0 16%;text-align:center}
.node strong{font-size:clamp(9px,.78vw + .2vh,13px);line-height:1.15}
.node .res{font:700 clamp(8px,.62vw,10px) Manrope;color:#c4eeaa}
.node small{font:clamp(7px,.55vw,9px) 'DM Mono',monospace;color:#a9bdb1;letter-spacing:.05em}
.node.available{background:var(--lime)}
.node.planned{background:#7fd3ff}.node.planned .node-inner{background:#173647}
.node.working{background:linear-gradient(to right,var(--amber) var(--p,0%),#3c5953 var(--p,0%))}
.node.done{background:var(--teal)}.node.done .node-inner{background:#163a33}
.node.busy,.node.locked,.node.short{background:#3a4846}.node.busy .node-inner,.node.locked .node-inner,.node.short .node-inner{background:#111d20;color:#7f8f8a}
.node.busy .res,.node.locked .res,.node.short .res{color:#6f807b}
.q{position:absolute;top:10%;right:24%;width:1.4em;height:1.4em;border-radius:50%;background:#f1c879;color:#2a1f05;font:800 clamp(9px,.7vw,12px) Manrope;display:grid;place-items:center}
.legend{display:flex;gap:1vw;flex-wrap:wrap;font-size:.74em;color:#aec3b5}
.legend i{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:.35em;vertical-align:-1px}
/* Timeline */
.timeline{flex:none;background:#0d1d23;border:1px solid #35504a;border-radius:9px;padding:1vh 1vw;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.2vw;align-items:center}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:1em;margin-bottom:.6vh}
.tl-head b{font-size:.86em}.tl-head span{font-size:.76em;color:#9fb4ad}
.track{position:relative;height:calc(var(--rows,1)*13px + 26px)}
.axis{position:absolute;left:0;right:0;top:9px;height:3px;background:#2a3f3b;border-radius:3px}
.now{position:absolute;top:2px;left:0;width:3px;height:calc(100% - 4px);background:var(--lime);box-shadow:0 0 8px var(--lime);transition:left 1.1s ease-in-out;z-index:2}
.tick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.tick i{width:13px;height:13px;border-radius:50%;background:#0d1d23;border:3px solid var(--amber);margin-top:4px}
.tick.first i{border-color:var(--lime);box-shadow:0 0 0 4px #b9f16e33}
.tick.radar i{border-color:#7fd3ff;border-style:dotted}
.tick em{font:600 .62em 'DM Mono',monospace;font-style:normal;color:#c9d9d0;margin-top:2px;white-space:nowrap}
.lane{position:absolute;left:0;height:8px;border-radius:4px;background:#7fd3ff;opacity:.85}
.lane.working{background:var(--amber)}
.lane span{position:absolute;right:calc(100% + 6px);top:-3px;font-size:.6em;color:#9fb4ad;white-space:nowrap;display:none}
.tl-empty{font-size:.82em;color:#8ca19b;padding:1vh 0}
.tl-side{display:flex;flex-direction:column;align-items:flex-end;gap:.5vh}
.tl-side small{font-size:.72em;color:#9fb4ad;max-width:16em;text-align:right}

/* Modal */
#modal{position:fixed;inset:0;z-index:30;background:#02060acc;display:none;place-items:center;padding:3vh 3vw}
#modal.open{display:grid;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.card{position:relative;width:min(560px,94vw);max-height:92dvh;overflow:auto;background:#152a2e;border:1px solid #54736b;border-radius:12px;padding:clamp(16px,2.4vh,28px) clamp(16px,2vw,30px);box-shadow:0 20px 60px #000c;animation:pop .25s ease}
.card.wide{width:min(980px,96vw)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.card h3{font-size:clamp(18px,1.6vw,26px);margin:.4vh 0 1vh}
.card p{margin:.8vh 0;color:#c4d5cd}
.card .close{position:absolute;top:10px;right:12px;background:none;border:0;font-size:22px;color:#9fb4ad}
.card .actions{display:flex;gap:.8em;margin-top:2vh;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin:1.4vh 0}
.facts div{background:#0f2024;border:1px solid #2f4944;border-radius:8px;padding:.6em .8em}
.facts small{display:block;font:.68em 'DM Mono',monospace;color:#8da6a5;letter-spacing:.08em}
.facts b{font-size:.95em}
.why{display:flex;gap:.7em;align-items:flex-start;background:#3a2f17;border:1px solid #8a7038;border-radius:8px;padding:.8em 1em;margin:1.2vh 0;color:#f6e2b0}
.why b{font-size:1.2em;line-height:1}
.steps{margin:1.4vh 0;padding:0;list-style:none;display:grid;gap:1vh}
.steps li{display:grid;grid-template-columns:2em 1fr;gap:.8em;align-items:start;color:#d3e2da;line-height:1.45}
.steps li span{width:2em;height:2em;border-radius:50%;background:var(--lime);color:#132214;display:grid;place-items:center;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.86em}
th{font:.7em 'DM Mono',monospace;letter-spacing:.1em;color:#8da6a5;text-align:left;padding:.5em;border-bottom:1px solid #3a544e}
td{padding:.55em .5em;border-bottom:1px solid #243733;color:#d5e3db}
td.unk{color:#6f837e}
.file-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.6vw;margin-top:1.4vh}
.chart{background:#0d1d23;border:1px solid #2f4944;border-radius:9px;padding:1em}
.chart h4,.file-grid h4{margin:0 0 .8em;font-size:.9em}
.chart svg{width:100%;display:block}
.meter{display:flex;align-items:center;gap:1em;margin-bottom:1.4em}
.meter strong{font:clamp(22px,2vw,30px) 'DM Mono',monospace;color:var(--lime)}
.sources a{color:#b9d9ce}

/* Sound toggle */
.sound-btn{min-width:2.6em}

/* Intro title card */
.s0{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#11263a,#03070c 70%)}
.s0 .title{position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2.2vh}
.s0 h1{font-size:clamp(34px,5vw,72px);letter-spacing:-.04em}
.s0 h1 span{color:var(--lime)}
.s0 p{color:#b9cbc4;font-size:clamp(14px,1.3vw,19px);max-width:34em}
.s0 .btn{font-size:clamp(15px,1.3vw,20px);padding:.8em 1.6em}
.s0 small{color:#6f857f;font-size:.8em}

/* Handoff / milestone */
.handoff{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.8vh;max-width:900px;margin:0 auto;width:100%}
.stamp{display:inline-flex;align-items:center;gap:.5em;font:700 clamp(11px,.9vw,14px) 'DM Mono',monospace;letter-spacing:.18em;color:var(--lime);border:2px solid var(--lime);border-radius:6px;padding:.45em 1em;transform:rotate(-4deg);animation:stamp .55s .2s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.4);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.handoff h2{font-size:clamp(28px,3.4vw + 1vh,56px);background:linear-gradient(90deg,#eaffd0,#b9f16e 50%,#7fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px #b9f16e33;animation:rise .6s .45s both}
.handoff .lead{font-size:clamp(13px,1.1vw,17px);color:#c6d7cf;animation:rise .6s .6s both}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.clue-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9vw;width:100%}
.clue{perspective:700px;height:clamp(78px,13vh,120px)}
.clue .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s ease;transform:rotateY(180deg)}
.clue.show .flip{transform:none}
.clue .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.3vh;padding:.6vh .5vw}
.clue .front{background:linear-gradient(160deg,#1d3a36,#122528);border:1px solid #4d7a6b}
.clue .back{background:repeating-linear-gradient(45deg,#14262a 0 8px,#112024 8px 16px);border:1px solid #2f4944;transform:rotateY(180deg);color:#5e7470;font:800 1.6em Manrope}
.clue .ico{font-size:clamp(18px,1.8vw,26px);line-height:1}
.clue small{font:.66em 'DM Mono',monospace;letter-spacing:.08em;color:#8fb3a6;text-transform:uppercase}
.clue b{font-size:clamp(12px,1.05vw,16px);color:#f2f8f2}
.clue.unknown .front{background:#111d20;border:1px dashed #3a504b}.clue.unknown b{color:#6f837e}
.clue:hover .front{border-color:var(--lime)}
.handoff-stats{display:flex;gap:2vw;align-items:center;justify-content:center;flex-wrap:wrap}
.handoff-stats .ring{display:flex;align-items:center;gap:.7em}
.handoff-stats strong{font:clamp(18px,1.6vw,26px) 'DM Mono',monospace;color:var(--lime)}
.handoff-stats .sep{width:1px;height:2.4em;background:#2f4944}
.handoff-stats div p{font-size:.8em}
.handoff .row-end{justify-content:center}
.handoff .btn.big{font-size:clamp(14px,1.2vw,18px);padding:.85em 1.6em}
.dart{font-size:.78em;max-width:60em;color:#8ea39c}

/* Transition to design lab */
#warp{position:fixed;inset:0;z-index:50;display:none;background:#03070c;overflow:hidden}
#warp.on{display:block}
#warp canvas{position:absolute;inset:0;width:100%;height:100%}
.warp-text{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:3;width:min(640px,90vw)}
.warp-text .eyebrow{color:var(--lime);display:block;margin-bottom:1.4vh}
.warp-text h3{font-size:clamp(24px,3vw,44px);margin:0 0 2.4vh;letter-spacing:-.03em}
.upload{height:8px;background:#1d2e2c;border-radius:6px;overflow:hidden}
.upload i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),#7fd3ff);transition:width 2.2s ease-in-out}
.warp-file{display:inline-flex;align-items:center;gap:.6em;margin-bottom:2vh;font-weight:800;color:#e2efe6;animation:filefly 2.6s ease-in forwards}
@keyframes filefly{0%,40%{transform:none;opacity:1}100%{transform:translateY(-30vh) scale(.4);opacity:0}}
.door{position:absolute;top:0;bottom:0;width:50.5%;z-index:4;background:linear-gradient(90deg,#1b2a33,#24384a);border:2px solid #3b5566;transition:transform .9s cubic-bezier(.7,0,.3,1)}
.door.l{left:0;transform:translateX(-101%);background-image:linear-gradient(90deg,#1b2a33,#24384a),repeating-linear-gradient(0deg,transparent 0 40px,#ffffff08 40px 41px)}
.door.r{right:0;transform:translateX(101%)}
#warp.close .door{transform:none}
.door.l:after,.door.r:after{content:'';position:absolute;top:50%;width:10px;height:90px;margin-top:-45px;background:var(--lime);border-radius:5px;box-shadow:0 0 18px var(--lime)}
.door.l:after{right:16px}.door.r:after{left:16px}
.door-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font:700 clamp(12px,1.1vw,16px) 'DM Mono',monospace;letter-spacing:.2em;color:var(--lime);opacity:0;transition:opacity .4s .7s;white-space:nowrap;background:#0d1a20;padding:.6em 1.2em;border:1px solid #3b5566;border-radius:6px}
#warp.close .door-label{opacity:1}

@media (max-width:820px){
 body{overflow:auto;height:auto;min-height:100dvh}
 main,main.with-side{grid-template-columns:1fr;gap:12px}
 .side{transform:none}.side:not(.show){display:none}
 .board{grid-template-columns:repeat(2,minmax(0,1fr));--hex:clamp(86px,30vw,130px)}
 .stages{display:none}
 .file-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>

 </aside>

<script>
'use strict';
/* ---------- State ---------- */
const START=96, RADAR_AT=78; // months left when the radar window opens
let stage='intro',time=START,done=[],risk=0,radarWindow=false,running=[],planned=[],history=[],seenHelp=false,introStep=0,fresh=[],busyAnim=false;

/* Jobs grouped by the real instrument (or team) that does them */
const instruments=[
 {id:'irtf',name:'NASA Infrared Telescope Facility',short:'IRTF telescope',place:'Mauna Kea, Hawaiʻi',shared:true},
 {id:'optical',name:'Optical telescope',short:'Optical telescope',place:'e.g. Lowell Discovery Telescope, Arizona',shared:true},
 {id:'radar',name:'Goldstone Solar System Radar',short:'Goldstone radar',place:'NASA Deep Space Network, California',shared:true},
 {id:'team',name:'JPL science team',short:'JPL science team',place:'Computer models — no telescope needed',shared:false},
 {id:'scout',name:'Scout spacecraft',short:'Scout spacecraft',place:'Flies out for close-up pictures',shared:true}];
const tasks=[
 {id:'infrared',inst:'irtf',name:'Heat-sensing telescope',cost:6,learn:'Width',desc:'Measure heat coming from the asteroid to estimate how wide it is.',out:'Width: about 50–90 meters'},
 {id:'spectroscopy',inst:'irtf',name:'Light color study',cost:5,learn:'Material',desc:'Split its reflected light into colors for clues about what it is made of.',out:'Surface material: probably rocky'},
 {id:'lightcurve',inst:'optical',name:'Watch it spin',cost:4,learn:'Spin time',desc:'Watch its brightness go up and down to work out how fast it spins.',out:'Spin time: about 5–7 hours'},
 {id:'radar',inst:'radar',name:'Radar scan',cost:3,learn:'Shape & path',desc:'Bounce radio waves off the asteroid to learn its shape and sharpen its path.',out:'Shape: irregular; path estimate improved',requires:'radarWindow'},
 {id:'reflectivity',inst:'team',name:'Compare light and heat',cost:2,learn:'Shininess',desc:'Combine the discovery pictures with the heat measurement to estimate how shiny its surface is.',out:'Reflectivity: medium (estimated)',requires:'infrared'},
 {id:'model',inst:'team',name:'Estimate its mass',cost:3,learn:'Mass',desc:'Combine its width with a guessed density to estimate how much matter it contains.',out:'Mass: about 0.25–0.55 billion kg (rough model)',requires:'infrared'},
 {id:'recon',inst:'scout',name:'Send a scout spacecraft',cost:24,learn:'Surface',desc:'Send a small spacecraft for close-up pictures of the surface.',out:'Surface: boulder-rich'}];
const T=id=>tasks.find(t=>t.id===id), I=id=>instruments.find(i=>i.id===id);

try{const saved=JSON.parse(sessionStorage.getItem('asteroidWatch.observation')||'null');if(saved&&Array.isArray(saved.done)&&Number.isFinite(saved.time)){time=saved.time;done=saved.done;risk=1;radarWindow=!!saved.radarWindow;history=Array.isArray(saved.history)?saved.history:[];stage=3;seenHelp=true}}catch(_){}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const years=n=>Math.floor(n/12)+'y '+(n%12)+'m';
const elapsed=()=>START-time;
const radarIn=()=>Math.max(0,time-RADAR_AT);
function log(t){$('#log').textContent=t}

/* ---------- Sound: all synthesized with Web Audio (no audio files) ---------- */
const Sound=(()=>{
 let ctx=null,master=null,muted=false,music=null;
 try{muted=localStorage.getItem('asteroidWatch.muted')==='1'}catch(_){}
 function init(){if(ctx){ctx.state==='suspended'&&ctx.resume();return true}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();master=ctx.createGain();master.gain.value=muted?0:.7;master.connect(ctx.destination);return true}
 const ok=()=>ctx&&!muted;
 function tone(freq,dur,{type='sine',vol=.2,at=0,attack=.005,slide=0,dest=master}={}){if(!ctx)return;const t=ctx.currentTime+at,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(dest);o.start(t);o.stop(t+dur+.05)}
 function noise(dur,{vol=.3,at=0,filter=3000,q=1,type='bandpass',sweep=0,dest=master}={}){if(!ctx)return;const t=ctx.currentTime+at,len=Math.ceil(ctx.sampleRate*dur),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=buf;f.type=type;f.frequency.setValueAtTime(filter,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+dur);f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(dest);s.start(t);s.stop(t+dur)}
 const api={
  init,
  click(){ok()&&tone(880,.06,{type:'triangle',vol:.12,slide:660})},
  soft(){ok()&&tone(520,.08,{type:'sine',vol:.1})},
  add(){if(!ok())return;tone(660,.09,{type:'triangle',vol:.14});tone(990,.12,{type:'triangle',vol:.12,at:.07})},
  remove(){if(!ok())return;tone(700,.09,{type:'triangle',vol:.12});tone(470,.12,{type:'triangle',vol:.1,at:.07})},
  nope(){if(!ok())return;tone(220,.18,{type:'square',vol:.06});tone(180,.22,{type:'square',vol:.05,at:.1})},
  shutter(){if(!ok())return;for(let k=0;k<3;k++){const a=k*.38;noise(.035,{vol:.5,at:a,filter:4500,q:.8});tone(1500,.02,{type:'square',vol:.05,at:a});noise(.05,{vol:.35,at:a+.07,filter:2200,q:1.2})}},
  chime(){if(!ok())return;[784,988,1319].forEach((f,i)=>tone(f,.6,{type:'sine',vol:.16,at:i*.09}))},
  tick(){ok()&&tone(1200,.03,{type:'square',vol:.04})},
  whoosh(dur=1.2){ok()&&noise(dur,{vol:.25,filter:300,sweep:5000,q:.7})},
  alert(){if(!ok())return;for(let k=0;k<3;k++){tone(660,.22,{type:'sawtooth',vol:.07,at:k*.5,slide:880});tone(880,.22,{type:'sawtooth',vol:.06,at:k*.5+.22,slide:660})}},
  fanfare(){if(!ok())return;[[523,0],[659,.12],[784,.24],[1047,.4]].forEach(([f,a])=>{tone(f,.5,{type:'triangle',vol:.16,at:a});tone(f/2,.6,{type:'sine',vol:.08,at:a})});tone(1568,1.1,{type:'sine',vol:.08,at:.55})},
  stamp(){if(!ok())return;noise(.12,{vol:.6,filter:180,type:'lowpass'});tone(90,.2,{type:'sine',vol:.3,slide:50})},
  flip(){ok()&&noise(.06,{vol:.15,filter:2500,q:2})},
  launchMusic(){if(!ok())return;const notes=[392,523,659,784,1047,1319];notes.forEach((f,i)=>{tone(f,.35,{type:'triangle',vol:.13,at:i*.16});tone(f*1.5,.3,{type:'sine',vol:.04,at:i*.16+.04})});[262,330,392].forEach(f=>tone(f,2.6,{type:'sawtooth',vol:.035,at:1,attack:.6}));noise(2.4,{vol:.18,at:.3,filter:200,sweep:6000,q:.6})},
  doors(){if(!ok())return;noise(.9,{vol:.25,filter:900,sweep:200,q:.8});tone(70,.5,{type:'sine',vol:.25,at:.85})},
  startMusic(){ // calm space pad + sparkles for the intro
   if(!ctx||music)return;const out=ctx.createGain();out.gain.value=0;out.gain.linearRampToValueAtTime(.55,ctx.currentTime+3);const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(out).connect(master);
   const oscs=[];const chords=[[110,164.8,220,277.2],[98,146.8,196,246.9],[87.3,130.8,174.6,220],[98,146.8,196,293.7]];
   chords[0].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i%2?'triangle':'sine';o.frequency.value=f;o.detune.value=(i-1.5)*6;g.gain.value=.09;o.connect(g).connect(lp);o.start();oscs.push(o)});
   let ci=0;const chordTimer=setInterval(()=>{ci=(ci+1)%chords.length;const t=ctx.currentTime;oscs.forEach((o,i)=>o.frequency.linearRampToValueAtTime(chords[ci][i],t+2.5))},6000);
   const pent=[659,740,880,988,1109,1319,1480];const spark=setInterval(()=>{if(muted)return;tone(pent[Math.floor(Math.random()*pent.length)],1.6,{type:'sine',vol:.05,attack:.02})},1400);
   music={out,oscs,timers:[chordTimer,spark]}},
  stopMusic(){if(!music||!ctx)return;const m=music;music=null;m.timers.forEach(clearInterval);const t=ctx.currentTime;m.out.gain.cancelScheduledValues(t);m.out.gain.setValueAtTime(m.out.gain.value,t);m.out.gain.linearRampToValueAtTime(0,t+1.5);setTimeout(()=>m.oscs.forEach(o=>{try{o.stop()}catch(_){}}),1700)},
  toggle(){muted=!muted;try{localStorage.setItem('asteroidWatch.muted',muted?'1':'0')}catch(_){}if(!muted)init();if(master)master.gain.value=muted?0:.7;paintBtn()}};
 function paintBtn(){const b=document.getElementById('soundBtn');if(b){b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-label',muted?'Turn sound on':'Turn sound off')}}
 api.paint=paintBtn;
 return api})();
// A soft click for every button that doesn't play its own sound
document.addEventListener('pointerdown',e=>{Sound.init();const b=e.target.closest('button');if(b&&!b.dataset.sfx)Sound.click()},true);

/* ---------- Intro: first-person story ---------- */
const stars=(n,w,h,seed)=>{let s=seed,out='';for(let i=0;i<n;i++){s=(s*9301+49297)%233280;let x=s/233280*w;s=(s*9301+49297)%233280;let y=s/233280*h;s=(s*9301+49297)%233280;let r=(s/233280)*1.4+.3;out+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}"/>`}return out};
const scenes=[
 {cls:'s1',tag:'Night shift · 9:47 pm',text:'It’s my first night shift at the observatory. My job as a planetary defense observer: watch the sky for anything that might come close to Earth.',
  svg:`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset=".7" stop-color="#16243d"/><stop offset="1" stop-color="#2b3145"/></linearGradient></defs><rect width="1600" height="900" fill="url(#sky1)"/><g fill="#dfe9f5" opacity=".85">${stars(140,1600,520,7)}</g><g class="walk"><g class="bob"><path d="M0 700 Q400 600 800 640 T1600 660 V900 H0Z" fill="#0b121c"/><rect x="690" y="470" width="220" height="190" fill="#1a2433"/><path d="M670 480 A130 130 0 0 1 930 480 Z" fill="#2a3648"/><rect x="782" y="352" width="36" height="128" fill="#121a26"/><rect x="775" y="560" width="50" height="100" rx="4" fill="#f1c879" opacity=".85"/><path d="M760 900 L790 660 H810 L840 900Z" fill="#141c28"/></g></g></svg>`},
 {cls:'s2',tag:'Inside the dome',text:'I open the dome. The telescope points up into the dark, and the camera starts taking pictures of the sky.',
  svg:`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#05080e"/><path d="M200 900 V520 A600 600 0 0 1 1400 520 V900Z" fill="#141c26"/><clipPath id="slit"><path d="M620 0 H980 V700 H620Z"/></clipPath><g clip-path="url(#slit)"><rect x="600" y="0" width="400" height="700" fill="#07122a"/><g fill="#e8f0ff">${stars(60,1600,700,21)}</g></g><g class="slitL"><rect x="620" y="0" width="180" height="700" fill="#1d2735"/></g><g class="slitR"><rect x="800" y="0" width="180" height="700" fill="#1d2735"/></g><g transform="translate(800 760) rotate(-18)"><rect x="-38" y="-330" width="76" height="360" rx="10" fill="#cfd8de"/><rect x="-46" y="-345" width="92" height="38" rx="8" fill="#9aa8b1"/></g><rect x="740" y="760" width="120" height="140" fill="#2b3644"/></svg>`},
 {cls:'s3',tag:'Looking through the eyepiece',text:'I look closer. The stars stay perfectly still… but one tiny dot is sliding across the sky.',
  svg:`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#000"/><defs><radialGradient id="ep" cx=".5" cy=".5" r=".5"><stop offset=".86" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000"/></radialGradient><clipPath id="eye"><circle cx="800" cy="430" r="340"/></clipPath></defs><g clip-path="url(#eye)"><rect x="400" y="80" width="800" height="700" fill="#06101f"/><g fill="#dfe9f5">${stars(90,1600,900,33)}</g><g class="mover"><circle cx="800" cy="430" r="5" fill="#c6f986"/><circle class="ring" cx="800" cy="430" r="18" fill="none" stroke="#b9f16e" stroke-width="2"/></g><path d="M460 430 H1140 M800 90 V770" stroke="#b9f16e33" stroke-width="1"/></g><circle cx="800" cy="430" r="340" fill="url(#ep)"/><circle cx="800" cy="430" r="342" fill="none" stroke="#1b232c" stroke-width="18"/></svg>`},
 {cls:'s4',tag:'Checking the pictures',text:'I flip between three pictures taken minutes apart. Everything stays in place — except that dot. It’s moving. It could be an asteroid.',
  svg:`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#0a0f15"/><rect x="330" y="120" width="940" height="600" rx="18" fill="#1a232d"/><rect x="360" y="150" width="880" height="540" fill="#06101b"/><g fill="#dfe9f5" transform="translate(360 150)">${stars(55,880,540,51)}</g><g class="f f1"><circle cx="620" cy="470" r="6" fill="#c6f986"/><text x="380" y="180" fill="#b9f16e" font-family="DM Mono" font-size="20">PICTURE 1 · 10:02 PM</text></g><g class="f f2"><circle cx="790" cy="420" r="6" fill="#c6f986"/><text x="380" y="180" fill="#b9f16e" font-family="DM Mono" font-size="20">PICTURE 2 · 10:22 PM</text></g><g class="f f3"><circle cx="960" cy="370" r="6" fill="#c6f986"/><text x="380" y="180" fill="#b9f16e" font-family="DM Mono" font-size="20">PICTURE 3 · 10:42 PM</text></g><path d="M620 470 L960 370" stroke="#b9f16e55" stroke-dasharray="6 8" stroke-width="2"/><rect x="740" y="720" width="120" height="70" fill="#1a232d"/><rect x="600" y="790" width="400" height="20" rx="6" fill="#1a232d"/></svg>`},
 {cls:'s5',tag:'Running the numbers',text:'I send the positions to the computer. It works out the asteroid’s path around the Sun… and the line keeps getting closer to Earth.',
  svg:`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#050c14"/><g fill="#9fb4c8" opacity=".35">${stars(60,1600,900,77)}</g><circle cx="700" cy="450" r="34" fill="#f7d774"/><circle cx="700" cy="450" r="60" fill="#f7d77422"/><ellipse cx="700" cy="450" rx="300" ry="290" fill="none" stroke="#4d7fa0" stroke-width="2" stroke-dasharray="4 6"/><circle cx="975" cy="335" r="16" fill="#3ea0c4"/><text x="995" y="320" fill="#9fd7ea" font-family="DM Mono" font-size="18">EARTH</text><path class="path" d="M200 80 C 520 140, 820 220, 975 335" fill="none" stroke="#f1c879" stroke-width="4"/><g class="calc"><text class="cl" x="1150" y="560" style="animation-delay:1.2s">orbit fit ............ ok</text><text class="cl" x="1150" y="590" style="animation-delay:2.2s">closest approach .... ~8 yrs</text><text class="cl" x="1150" y="620" style="animation-delay:3.2s">miss distance ....... ???</text><text class="cl" x="1150" y="650" style="animation-delay:4.4s" fill="#ff8a7a">impact possible ..... YES</text></g></svg>`},
 {cls:'s6',tag:'Alert · asteroid 2026 AX',text:'It might hit Earth in about 8 years. If we learn enough about it, we can build a spacecraft to bump it off course. I need to find out more — and fast.',
  svg:`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#0a0608"/><rect class="alert" width="1600" height="900" fill="#3a0d0d"/><g fill="#e8d8d8" opacity=".4">${stars(70,1600,900,99)}</g><circle cx="560" cy="430" r="120" fill="#2e7f98"/><path d="M500 360 q40 -20 70 10 t60 40 q-20 50 -80 30 z M600 470 q40 10 50 40 q-30 20 -60 -10z" fill="#3f8f5c"/><circle cx="560" cy="430" r="140" fill="none" stroke="#7fd3ff33" stroke-width="10"/><g transform="translate(1080 360) rotate(-20)"><ellipse rx="70" ry="52" fill="#8a7f69"/><circle cx="-20" cy="-12" r="12" fill="#5d5546"/><circle cx="25" cy="15" r="8" fill="#5d5546"/></g><path d="M1010 385 L720 420" stroke="#ff7a6b" stroke-width="4" stroke-dasharray="14 12"/><text x="800" y="160" text-anchor="middle" fill="#ff8a7a" font-family="DM Mono" font-size="34" letter-spacing="6">⚠ POSSIBLE IMPACT</text></svg>`}];
scenes.unshift({cls:'s0',title:true,svg:`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><g fill="#dfe9f5" opacity=".7">${stars(160,1600,900,3)}</g></svg>`});
function renderIntro(){
 let box=$('#intro');
 if(!box.dataset.built){box.innerHTML=scenes.map((s,i)=>s.title?`<div class="scene s0" data-i="${i}">${s.svg}<div class="title"><span class="eyebrow" style="color:var(--lime)">A planetary defense story</span><h1>Asteroid <span>Watch</span></h1><p>Tonight I start my first shift watching the sky for anything that could come close to Earth.</p><button class="btn pulse" data-sfx="1" onclick="beginIntro()">▶ Begin</button><small>Best with sound on 🔊</small></div></div>`:`<div class="scene ${s.cls}" data-i="${i}">${s.svg}<div class="caption"><span class="eyebrow">${s.tag}</span><p>${s.text}</p></div></div>`).join('')+`<div class="intro-dots" id="dots">${scenes.slice(1).map(()=>'<i></i>').join('')}</div><div class="intro-ctrl"><button class="btn ghost" onclick="endIntro()">Skip intro</button><button class="btn pulse" id="nextBtn" data-sfx="1" onclick="nextScene()">Next →</button></div>`;box.dataset.built=1}
 box.querySelectorAll('.scene').forEach((el,i)=>{let on=i===introStep;if(on&&!el.classList.contains('on')){el.querySelectorAll('svg *').forEach(n=>{n.style.animation='none';void n.getBoundingClientRect();n.style.animation=''})}el.classList.toggle('on',on)});
 box.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<introStep));
 $('#nextBtn').style.visibility=introStep===0?'hidden':'visible';
 $('#nextBtn').textContent=introStep===scenes.length-1?'Start my mission →':'Next →';
 sceneSound(scenes[introStep].cls);
}

/* ---------- Status of a job ---------- */
function blocker(t){ // the job using the same instrument, if any
 let inst=I(t.inst);if(!inst.shared)return null;
 let other=[...running.map(r=>r.id),...planned].find(id=>id!==t.id&&T(id).inst===t.inst);
 return other?T(other):null}
function status(t){
 if(done.includes(t.id))return 'done';
 if(running.some(r=>r.id===t.id))return 'working';
 if(planned.includes(t.id))return 'planned';
 if(t.requires==='radarWindow'&&!radarWindow)return 'locked';
 if(t.requires&&t.requires!=='radarWindow'&&!done.includes(t.requires))return 'locked';
 if(blocker(t))return 'busy';
 if(time<t.cost)return 'short';
 return 'available'}
function reason(t){
 let st=status(t),b=blocker(t),inst=I(t.inst);
 if(st==='busy'){let r=running.find(x=>x.id===b.id);return `The ${inst.short} is busy with <b>${b.name}</b>${r?` for ${r.remaining} more month${r.remaining===1?'':'s'}`:' (planned for this round)'}. One instrument can only do one job at a time. It becomes free again when that job is done.`}
 if(st==='locked')return t.requires==='radarWindow'?`Goldstone can only bounce radio waves off the asteroid when it comes closer to Earth. That happens in <b>${radarIn()} month${radarIn()===1?'':'s'}</b>.`:`This job needs the asteroid’s <b>width</b> first. Finish the <b>Heat-sensing telescope</b> job to unlock it.`;
 if(st==='short')return `There isn’t enough mission time left. This job takes ${t.cost} months, but only ${time} remain.`;
 return ''}

/* ---------- Round timing ---------- */
function roundItems(){return [...running.map(r=>({id:r.id,end:r.remaining,state:'working'})),...planned.map(id=>({id,end:T(id).cost,state:'planned'}))]}
function roundLength(){let it=roundItems();return it.length?Math.max(...it.map(x=>x.end)):0}
function nextStop(includePlanned){let ev=[...running.map(r=>r.remaining)];if(includePlanned)ev.push(...planned.map(id=>T(id).cost));if(ev.length&&!radarWindow&&radarIn()>0)ev.push(radarIn());return ev.length?Math.min(...ev):null}

 let span=Math.max(len,1),first=nextStop(true),ticks=[...new Set(items.map(x=>x.end))].sort((a,b)=>a-b);

 let tickHtml=ticks.map(m=>`<div class="tick ${m===first?'first':''}" style="left:${m/span*100}%"><i></i><em>${m} mo</em></div>`).join('')+(rad&&!ticks.includes(rad)?`<div class="tick radar ${rad===first?'first':''}" style="left:${rad/span*100}%"><i></i><em>radar opens</em></div>`:'');

function openJob(id){let t=T(id),st=status(t),inst=I(t.inst),r=running.find(x=>x.id===id);['busy','locked','short'].includes(st)?Sound.nope():Sound.soft();

 else if(opened){Sound.chime();log('Radar window is now open.');openModal(`<div class="eyebrow">${n} months later</div><h3>The radar can see it now!</h3><p>The asteroid is close enough for the Goldstone radar to bounce radio waves off it.</p><div class="actions"><button class="btn" onclick="closeModal()">Got it</button></div>`)}
}

function playWarp(done){

 function frame(t){const e=(t-t0)/1000,speed=.004+Math.min(e,2.4)*.012,cx=cv.width/2,cy=cv.height/2,sc=Math.max(cv.width,cv.height);

 let rows=[...history.map(h=>({...h,state:'done'})),...running.map(r=>({id:r.id,start:r.start,end:r.start+T(r.id).cost,state:'working'}))];
 let max=Math.max(12,used,...rows.map(r=>r.end)),W=420,rowH=26,H=Math.max(1,rows.length)*rowH+34,x=m=>110+m/max*(W-120);
 let gantt=rows.length?`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of when each investigation ran"><g font-family="Manrope" font-size="10" fill="#c9d9d0">${rows.map((r,k)=>`<text x="0" y="${k*rowH+16}">${T(r.id).name}</text><rect x="${x(r.start)}" y="${k*rowH+6}" width="${Math.max(3,x(r.end)-x(r.start))}" height="14" rx="4" fill="${r.state==='done'?'#74c9a6':'#f1c879'}"/>`).join('')}</g><line x1="${x(used)}" x2="${x(used)}" y1="0" y2="${H-20}" stroke="#b9f16e" stroke-dasharray="3 3"/><g font-family="DM Mono" font-size="9" fill="#8da6a5">${[0,.25,.5,.75,1].map(p=>`<text x="${x(p*max)}" y="${H-4}" text-anchor="middle">${Math.round(p*max)}m</text>`).join('')}</g></svg>`:'<p class="hint">No investigations yet. They’ll appear here as bars on a timeline.</p>';
 let ring=`<svg viewBox="0 0 80 80" width="80" height="80" aria-hidden="true"><circle cx="40" cy="40" r="32" fill="none" stroke="#283b39" stroke-width="9"/><circle cx="40" cy="40" r="32" fill="none" stroke="#b9f16e" stroke-width="9" stroke-linecap="round" stroke-dasharray="${2*Math.PI*32}" stroke-dashoffset="${2*Math.PI*32*(1-known/f.length)}" transform="rotate(-90 40 40)"/></svg>`;
 let timeBar=`<svg viewBox="0 0 300 34" aria-label="Mission time used"><rect x="0" y="6" width="300" height="14" rx="7" fill="#283b39"/><rect x="0" y="6" width="${used/START*300}" height="14" rx="7" fill="#f1c879"/><text x="0" y="32" font-family="DM Mono" font-size="9" fill="#8da6a5">USED ${used} mo</text><text x="300" y="32" text-anchor="end" font-family="DM Mono" font-size="9" fill="#8da6a5">LEFT ${years(time)}</text></svg>`;
 openModal(`<div class="eyebrow">Asteroid data file · 2026 AX</div><h3>Everything I’ve learned so far</h3><div class="file-grid"><div><table><thead><tr><th>Clue</th><th>What we know</th><th>How we found out</th><th>When</th></tr></thead><tbody>${f.map(x=>`<tr><td>${x.name}</td><td class="${x.known?'':'unk'}">${x.known?x.value:'Not known yet'}</td><td class="${x.known?'':'unk'}">${x.known?x.by:'—'}</td><td class="${x.known?'':'unk'}">${x.known?x.when:''}</td></tr>`).join('')}</tbody></table></div><div><div class="meter">${ring}<div><strong>${known}/${f.length}</strong><p>clues known</p></div></div><div class="chart"><h4>Mission time</h4>${timeBar}</div><div class="chart" style="margin-top:1em"><h4>When each investigation ran</h4>${gantt}</div></div></div><div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`,true)}

function openNotes(){openModal(`<div class="eyebrow">Science notes & sources</div><h3>What’s real and what’s a game rule</h3><p>This is a fictional scenario. Values, costs, results and windows are game approximations, not NASA predictions. New observations can raise or lower impact probability; they do not always reduce it.</p><p>The instruments are real: NASA’s Infrared Telescope Facility measures asteroid heat (to estimate size) and light colors (to estimate material); optical telescopes record brightness changes to find spin; the Goldstone Solar System Radar images the shapes of nearby asteroids and sharpens their paths. Job lengths, “one job per instrument”, and the radar opening time are simplified game rules. Mass is inferred from size and an assumed density, not measured directly.</p><p class="sources"><a href="https://irtfweb.ifa.hawaii.edu/" target="_blank" rel="noopener">NASA IRTF</a> · <a href="https://www.jpl.nasa.gov/images/pia14733-how-to-tell-the-size-of-an-asteroid/" target="_blank" rel="noopener">JPL · Size and reflectivity</a> · <a href="https://cneos.jpl.nasa.gov/sentry/intro.html" target="_blank" rel="noopener">JPL · Sentry impact monitoring</a> · <a href="https://www.nasa.gov/solar-system/asteroids/near-earth-asteroid/nasas-planetary-radar-tracks-two-large-asteroid-close-approaches/" target="_blank" rel="noopener">NASA · Planetary radar</a> · <a href="https://science.nasa.gov/solar-system/asteroids/didymos/" target="_blank" rel="noopener">NASA · DART mission</a></p><div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}

/* ---------- Modal ---------- */
function openModal(html,wide){let card=$('#card');card.className='card'+(wide?' wide':'');card.innerHTML=`<button class="close" onclick="closeModal()" aria-label="Close">×</button>`+html;$('#modal').classList.add('open');setTimeout(()=>{let b=card.querySelector('.actions .btn');b&&b.focus()},50)}
function closeModal(){$('#modal').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(stage==='intro'&&(e.key==='ArrowRight'||e.key==='Enter')){e.preventDefault();introStep===0?beginIntro():nextScene()}});

Sound.paint();if(stage==='intro'){$('#intro').style.display='flex'}else{$('#intro').style.display='none'}
render();
</script></body></html>
